<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B2E1D">
<meta name="description" content="Ficha de admissão do Posto Trevo: preencha seus dados e envie seus documentos.">
<meta property="og:title" content="Posto Trevo – Ficha de admissão">
<meta property="og:description" content="Preencha sua ficha cadastral e envie as fotos dos seus documentos.">
<meta property="og:site_name" content="Posto Trevo">
<meta property="og:type" content="website">
<title>Portal do RH · Posto Trevo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Copa do posto (verde escuro), verde Trevo, amarelo de sinalização, concreto da pista */
  --verde:#0B2E1D;--verde2:#0E6B3A;--ouro:#F5B800;--creme:#E9EDEA;--papel:#fff;
  --tinta:#17221C;--cinza:#56625B;--linha:#D2D9D4;--suave:#E1E7E2;
  --erro:#B42D22;--erro-bg:#FBECEA;--azul:#2463B5;--verm:#C8372D;--r:14px;
  /* pétalas do trevo: usadas só como código de cor */
  --p-verm:#C8372D;--p-verde:#1E8A45;--p-azul:#2463B5;--p-amar:#F5B800;
  --faixa:linear-gradient(90deg,var(--p-verm) 0 25%,var(--p-verde) 25% 50%,var(--p-azul) 50% 75%,var(--p-amar) 75%);
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;background:var(--creme);color:var(--tinta);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:-.005em;line-height:1.05;color:var(--tinta)}
h1{font-size:clamp(32px,6vw,44px)}
h2{font-size:26px;font-weight:600}
h3{font-size:19px;font-weight:600;letter-spacing:0}
p{margin:.5em 0}
a{color:var(--verde2)}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* topo */
.demo-strip{background:var(--ouro);color:var(--verde);text-align:center;font-weight:700;font-size:13px;padding:6px 12px}
.top{background:var(--verde);color:var(--creme);border-bottom:5px solid;border-image:var(--faixa) 1}
.top-in{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.top svg{width:40px;height:40px;flex:none}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em;color:var(--ouro);line-height:1}
.brand-sub{font-size:14px;opacity:.85;margin-top:2px}
.top .sp{flex:1}
.top .lnk{background:none;border:1px solid rgba(233,237,234,.35);color:var(--creme);border-radius:999px;padding:6px 14px;font-size:14px}

.wrap{max-width:780px;margin:0 auto;padding:20px 16px 64px}
.wrap.largo{max-width:1080px}
.wrap.estreito{max-width:420px}
.wrap.trab{max-width:620px}
.trab h1{font-size:clamp(36px,10vw,56px);line-height:.95;margin:0 0 12px}.trab h1 span{display:inline-block}
.card{background:var(--papel);border-radius:var(--r);padding:22px;border:1px solid var(--linha);margin-bottom:16px}
.muted{color:var(--cinza)}
.eyebrow{font-weight:600;color:var(--verde2);font-size:15px;margin:0 0 4px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:16px;text-decoration:none;min-height:46px;transition:transform .05s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--verde2);color:#fff}
.btn.pri:hover:not(:disabled){filter:brightness(1.15)}
.btn.ouro{background:var(--ouro);color:var(--verde)}
.btn.sec{background:var(--suave);color:var(--verde)}
.btn.sec:hover{background:#D5DDD7}
.btn.perigo{background:var(--erro-bg);color:var(--erro)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:10px}
.nav{pointer-events:none;display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--creme) 30%)}
.nav .btn{flex:1;pointer-events:auto}
.nav .btn.pri{flex:2}

/* etapas */
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 18px}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--cinza)}
.steps li::before{content:"";height:6px;border-radius:6px;background:var(--linha)}
.steps li.done::before{background:var(--verde2)}
.steps li.cur::before{background:var(--ouro)}
.steps li.cur{color:var(--verde);font-weight:700}
@media(max-width:560px){.steps li em{display:none}.steps li.cur em{display:inline}.steps li.cur{flex:3}}
.steps em{font-style:normal}

/* formulário */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 12px;margin-top:16px}
.fld{grid-column:span 12;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.h{grid-column:span 6}.fld.t{grid-column:span 4}.fld.q{grid-column:span 3}.fld.g{grid-column:span 8}
@media(max-width:600px){.fld.h,.fld.g{grid-column:span 12}.fld.t,.fld.q{grid-column:span 6}}
.sub{grid-column:span 12;margin-top:10px;padding-top:14px;border-top:1px dashed var(--linha)}
label{font-weight:600;font-size:15px}
.req{color:var(--verm);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:48px;border:1.5px solid var(--linha);border-radius:10px;padding:10px 12px;background:#fff;color:var(--tinta);outline:none;transition:border .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--verde) 50%),linear-gradient(135deg,var(--verde) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(245,184,0,.35)}
.fld small{color:var(--cinza);font-size:13px}
.fld .err{color:var(--erro);font-size:13px;font-style:normal;font-weight:600;min-height:0}
.fld.inv input,.fld.inv select{border-color:var(--erro);background:var(--erro-bg)}

/* boas-vindas */
.hero h1{margin-bottom:8px}
.lista-check{list-style:none;padding:0;margin:10px 0 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
@media(max-width:560px){.lista-check{grid-template-columns:1fr}}
.lista-check li{position:relative;padding-left:26px}
.lista-check li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:var(--ouro);box-shadow:inset 0 0 0 4px var(--verde)}
.aviso{background:#fff6d6;border-left:5px solid var(--ouro);border-radius:10px;padding:12px 14px;margin:14px 0}
.aviso.erro{background:var(--erro-bg);border-color:var(--erro)}

/* anexos */
.docs{display:grid;gap:12px;margin-top:14px}
.doc{border:1.5px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.doc.ok{border-color:#b9d8c2;background:#f3faf5}
.doc-h{display:flex;gap:12px;align-items:flex-start}
.doc-h small{display:block;color:var(--cinza);font-weight:400;font-size:13px}
.doc-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--suave);color:var(--verde)}
.doc.ok .doc-ic{background:var(--verde2);color:#fff}
.doc.falta .doc-ic{background:var(--ouro)}
.files{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li em{color:var(--cinza);font-style:normal;font-size:12px}
.x{border:0;background:var(--suave);color:var(--erro);width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1}
.file{align-self:flex-start;cursor:pointer;position:relative;overflow:hidden}
/* no iPhone o seletor de arquivos não abre se o campo estiver escondido com display:none */
.arq-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.up{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--verde2);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--linha);border-top-color:var(--verde2);animation:gira .8s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}

/* revisão */
.pend{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.pend li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
details{border-top:1px solid var(--linha);padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--verde2)}
details[open] summary::after{content:"–"}
dl.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
dl.kv dt{color:var(--cinza)}
dl.kv dd{margin:0;font-weight:600;word-break:break-word}
.termo{max-height:280px;overflow:auto;border:1.5px solid var(--linha);border-radius:12px;padding:6px 16px;font-size:14px;background:#fff}
.termo h3{margin:12px 0 4px;font-size:14px}
.aceite{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-weight:600;cursor:pointer}
.aceite input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--verde2);margin-top:1px}

/* telas finais */
.fim{text-align:center;padding:40px 24px}
.fim .selo{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:38px;background:var(--verde2);color:#fff}
.fim .selo.erro{background:var(--erro)}
.fim .selo.neutro{background:var(--ouro);color:var(--verde)}

/* RH */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--verde);color:var(--creme);border-radius:var(--r);padding:16px 18px}
/* números no estilo do totem de preços do posto */
.kpi b{display:block;font-family:var(--disp);font-size:52px;color:var(--ouro);line-height:.9;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:14px;opacity:.9}
.kpi.claro{background:var(--papel);color:var(--tinta);border:1px solid var(--linha)}
.kpi.claro b{color:var(--verde)}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra .busca{flex:1;min-width:200px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros{--c:#1E7A3D;--bg:#e4f3e9}
.filtros button{--c:#1E7A3D;--bg:#e4f3e9;display:inline-flex;align-items:center;gap:8px;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);background:var(--bg);border-radius:999px;padding:7px 8px 7px 14px;font-size:14px;font-weight:700;color:var(--c);transition:transform .1s,box-shadow .15s}
.filtros button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.filtros button:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px var(--c)}
.filtros button .n{min-width:24px;padding:1px 8px;border-radius:999px;background:var(--c);color:#fff;font-size:12.5px;text-align:center;line-height:1.5}
.filtros button.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 6px 16px -8px var(--c)}
.filtros button.on::before{background:#fff}
.filtros button.on .n{background:#fff;color:var(--c)}
.filtros [data-f=pendente],.filtros [data-f=andamento]{--c:#1f56ad;--bg:#e7effc}
.filtros [data-f=conferir]{--c:#a86b00;--bg:#fff1c2}
.filtros [data-f=desligados],.filtros [data-f=cancelado]{--c:#b3261e;--bg:#fbeceb}
.filtros [data-f=todos]{--c:#475569;--bg:#eef0f3}
.filtros [data-f=c_entrevista]{--c:#1f56ad;--bg:#e7effc}.filtros [data-f=c_analise]{--c:#a86b00;--bg:#fff1c2}.filtros [data-f=c_banco]{--c:#6d3fb5;--bg:#f0e9fb}
.filtros [data-f=c_descartado]{--c:#b3261e;--bg:#fbeceb}.filtros [data-f=c_todos]{--c:#475569;--bg:#eef0f3}
.s-banco{background:#f0e9fb;color:#6d3fb5}.s-desc{background:#eef0f3;color:#475569}
.cand-msg{white-space:pre-wrap;background:var(--creme);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.filtros [data-f=aprendiz]{--c:#6B4FBB;--bg:#efeafb}
.s-aprendiz{background:#efeafb;color:#5b3fa8}
.itens{display:grid;gap:10px}
.item{background:var(--papel);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;border:1px solid var(--linha);cursor:pointer}
.item:hover{border-color:var(--verde2);box-shadow:inset 4px 0 0 var(--ouro)}
.item .nome{font-weight:700;font-size:17px}
.item .meta{font-size:14px;color:var(--cinza);display:flex;gap:10px;flex-wrap:wrap}
.item .acoes{display:flex;gap:8px;align-items:center;grid-row:span 2}
@media(max-width:600px){.item{grid-template-columns:1fr}.item .acoes{grid-row:auto}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-novo{background:#eef0ea;color:#55605a}
.s-prog{background:#e7effc;color:#1f56ad}
.s-env{background:#fff1c2;color:#7a5a00}
.s-cor{background:#fde7e3;color:#a3331f}
.s-ok{background:#dff2e5;color:#17663a}
.s-can{background:#eee;color:#777}
.vazio{text-align:center;padding:48px 20px;color:var(--cinza)}
.det-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.det-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.datas{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--cinza);margin-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.cols .card{margin:0}
.chk{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chk .m{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700}
.chk .m.ok{background:var(--verde2);color:#fff}
.chk .m.no{background:var(--erro-bg);color:var(--erro)}
.chk .m.op{background:var(--suave);color:var(--cinza)}
.chk a{display:block;font-size:13px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(11,46,29,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-c{width:100%;max-width:480px;margin:0;max-height:92vh;overflow:auto;border:0;box-shadow:0 24px 60px -20px rgba(11,46,29,.5)}
.modal-c h2{margin-bottom:10px}
.modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.linkbox{display:flex;gap:8px;margin:12px 0}
.linkbox input{font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,440px)}
.tst{background:var(--verde);color:#fff;border-left:5px solid var(--ouro);padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:sobe .2s ease-out}
.tst.erro{background:var(--erro);color:#fff}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}}
.carregando{display:grid;place-items:center;gap:14px;padding:80px 0;color:var(--cinza)}
.carregando .spin{width:34px;height:34px;border-width:4px}

/* relatórios */
.tab-wrap{overflow-x:auto;margin-top:6px}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab th{text-align:left;font-weight:600;color:var(--verde);background:var(--creme);padding:9px 10px;white-space:nowrap}
.tab td{padding:9px 10px;border-top:1px solid var(--linha);vertical-align:top}
.tab tr.hoje td{background:#fff6d6}
.tab td a{color:var(--verde2);font-weight:600;text-decoration:none}
.tag-hoje{display:inline-block;margin-left:6px;background:var(--ouro);color:var(--verde);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
@media(max-width:600px){.cols3{grid-template-columns:1fr}}
.tam{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.tam li{display:inline-flex;gap:8px;align-items:center;background:var(--suave);border-radius:8px;padding:4px 10px;font-size:14px}
.tam li b{color:var(--verde2)}

/* comunicados */
.modelos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--linha);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;background:#fff}
.chips label:has(input:checked){background:var(--verde);border-color:var(--verde);color:var(--ouro)}
.chips input{width:16px;height:16px;min-height:0;accent-color:var(--ouro)}
.resumo-env{font-weight:700;color:var(--verde2);margin:12px 0 0}
.bolha{background:#dcf8c6;border-radius:12px 12px 12px 2px;padding:12px 14px;white-space:pre-wrap;font-size:15px;max-width:520px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.barra-prog{height:10px;border-radius:10px;background:var(--suave);overflow:hidden;margin:10px 0 4px}
.barra-prog i{display:block;height:100%;background:var(--verde2);border-radius:10px;transition:width .3s}
.dest{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--linha)}
.dest:first-child{border-top:0}
.dest small{color:var(--cinza);display:block}
.dest.ok .nome{color:var(--cinza)}
.dest .lado{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lnk2{background:none;border:0;color:var(--cinza);text-decoration:underline;font-size:13px;padding:4px}

/* painel de RH */
.abas{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:4px 0 16px;border-bottom:2px solid var(--linha)}
.abas>button:not(.btn){border:0;background:none;padding:10px 14px;font-weight:700;color:var(--cinza);border-bottom:3px solid transparent;margin-bottom:-2px;font-size:15px}
.abas>button.on{color:var(--verde);border-bottom-color:var(--ouro)}
.abas>button:not(.btn){font-size:16px}
.abas .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--suave);font-size:12px;margin-left:2px;text-align:center}
.abas .sp{flex:1}
.abas .btn{margin:0 0 6px}
.s-desl{background:#f1e4e1;color:#7d2a1c}
.kpi.alerta b{color:var(--erro)}
.lista-ev{list-style:none;padding:0;margin:12px 0 0}

    case 'entrar': if (String(q.usuario).toLowerCase() !== 'admin' || q.senha !== 'trevo2026') throw new Error('Usuário ou senha incorretos.');
      r = { token: 'trevo2026', usuario: { login: 'admin', nome: 'Administrador', perfil: 'admin' } }; break;
    case 'sairPainel': break;
    case 'getConfig': rh(); r = { config: db.cfg || {} }; break;
    case 'setConfig': rh(); db.cfg = q.config; r = { config: db.cfg }; break;
    case 'usuarios': rh(); r = { usuarios: [] }; break;
    case 'infoSeguranca': rh(); r = { backup: { ligado: false, quando: '' } }; break;
    case 'atividades': rh(); r = { itens: [] }; break;
    case 'candidatar': db.cands = db.cands || []; db.cands.push({ ...q.dados, codigo: 'cv' + novoId().slice(0, 10), quando: agora, status: 'novo', arquivo: q.arquivo ? q.arquivo.nome : '', file_id: q.arquivo ? 'demo' : '', url: '' }); break;
    case 'candidatos': rh(); r = { candidatos: [...(db.cands || [])].reverse() }; break;
    case 'candidatoStatus': { rh(); const c = (db.cands || []).find(x => x.codigo === q.codigo); Object.assign(c, { status: q.status, obs_rh: q.obs }); break; }
    case 'removerCandidato': rh(); db.cands = (db.cands || []).filter(x => x.codigo !== q.codigo); break;
    case 'contratarCandidato': throw new Error('Não disponível no modo demonstração.');
    case 'minhaSenha': case 'backupAgora': case 'salvarUsuario': case 'removerUsuario': rh(); throw new Error('Não disponível no modo demonstração.');
    default: throw new Error('Ação inválida.');
  }
  try { localStorage.setItem(MOCK.k, JSON.stringify(db)); } catch (e) {}
  return JSON.parse(JSON.stringify({ ok: true, ...r }));
}

function campoHTML(f, d) {
  if (f.sub) return `<div class="sub"><h3>${esc(f.sub)}</h3></div>`;
  const val = d[f.k] ?? '', id = 'f_' + f.k;
  let inp;
  if (f.t === 'select') {
    inp = `<select id="${id}" data-k="${f.k}"><option value="">Selecione…</option>${f.op.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    inp = `<textarea id="${id}" data-k="${f.k}" maxlength="${f.max || 500}">${esc(val)}</textarea>`;
  } else if (f.list) {
    inp = `<input id="${id}" data-k="${f.k}" value="${esc(val)}" list="dl_${f.k}" autocomplete="off" maxlength="${f.max || 120}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}><datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  } else {
    const tipo = f.t === 'date' ? 'date' : f.t === 'email' ? 'email' : f.t === 'password' ? 'password' : 'text';
    const modo = f.mask ? (f.mask === 'tel' ? 'tel' : 'numeric') : f.t === 'email' ? 'email' : '';
    inp = `<input id="${id}" data-k="${f.k}" type="${tipo}" value="${esc(val)}" autocomplete="${f.auto || (f.t === 'password' ? 'new-password' : 'off')}"${modo ? ` inputmode="${modo}"` : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.mask && f.mask !== 'tel' ? ` maxlength="${f.mask.length}"` : ` maxlength="${f.max || 120}"`}${TRAVA.has(f.k) ? ' readonly' : ''}>`;
  }
  return `<div class="fld ${f.w || ''}" data-wrap="${f.k}"${f.show && !f.show(d) ? ' hidden' : ''}>
    <label for="${id}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>${inp}
    ${f.hint ? `<small>${esc(f.hint)}</small>` : ''}<em class="err"></em></div>`;
}
function errosSecao(s, d) {
  const e = {};
  s.campos.forEach(f => {
    if (!f.k || (f.show && !f.show(d))) return;
    const v = String(d[f.k] || '').trim();

    if (f.v) { const m = f.v(v, d); if (m) e[f.k] = m; }
  });
  return e;
}

/* envio de arquivos */
function mimeDe(file) {
  if (file.type) return file.type;
  const e = (file.name.split('.').pop() || '').toLowerCase();
  return { doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic', heif: 'image/heif', webp: 'image/webp' }[e] || '';
}
function carregarImg(file) {
  return new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); no(); }; i.src = u; });
}
async function preparar(file) {
  const mime = mimeDe(file);
  if (!/^image\/(jpeg|png|webp)$/.test(mime)) return { blob: file, mime, nome: file.name };
  try {
    const img = await carregarImg(file);
    const f = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    if (f === 1 && file.size < 900 * 1024) return { blob: file, mime, nome: file.name };
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * f); cv.height = Math.round(img.naturalHeight * f);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .82));
    if (!blob) throw 0;
    return { blob, mime: 'image/jpeg', nome: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
  } catch (e) { return { blob: file, mime, nome: file.name }; }
}
const paraB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });

async function subir(tipo, files) {
  for (const file of files) {
    C.subindo[tipo] = (C.subindo[tipo] || 0) + 1; rColab();
    try {
      const { blob, mime, nome } = await preparar(file);
      if (!/^(image\/(jpeg|png|webp|heic|heif)|application\/pdf)$/.test(mime)) throw new Error('formato não aceito. Envie foto ou PDF.');
      if (blob.size > 10 * 1024 * 1024) throw new Error('arquivo maior que 10 MB.');
      const r = await api('enviarDoc', { codigo: C.codigo, tipo, nome, mime, base64: await paraB64(blob) });
      C.docs.push(r.doc);
    } catch (e) { toast(`${file.name}: ${e.message}`, 'erro'); }
    C.subindo[tipo]--; rColab();
  }
}

function periodosFerias(p, evs) {

    const fimAq = addDias(addAnos(ad, k + 1), -1), limite = addDias(addAnos(ad, k + 2), -1);
    const g = gozos.filter(e => String(e.periodo) === String(k));

    const sit = diasG >= 30 ? 'gozada' : fimAq >= hoje0() ? 'aquisicao' : limite < hoje0() ? 'vencida' : 'pendente';
    l.push({ k, ini, fimAq, limite, gozos: g, diasG, sit });

}

  try { R.senha = sessionStorage.getItem('rh_s') || ''; R.user = JSON.parse(sessionStorage.getItem('rh_u') || 'null'); } catch (e) {}
  if (!R.user) R.senha = '';
  if (R.senha) carregarLista(true); else telaLogin();
}
function telaLogin(msg, usr) {
  document.body.classList.remove('rh-on'); fecharModal();
  app.innerHTML = topo('Painel do RH') + `<main class="wrap estreito"><form class="card" id="flogin" style="margin-top:24px">
    <p class="eyebrow">Acesso restrito</p><h1>Painel do RH</h1>
    <p class="muted">Funcionários, admissões, documentos e comunicados do Posto Trevo.</p>
    ${DEMO ? '<div class="aviso">Modo demonstração. Usuário: <b>admin</b> · Senha: <b>trevo2026</b></div>' : ''}
    <div class="fld" style="margin:16px 0 0"><label for="usuario">Usuário</label><input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="fld" style="margin:12px 0 16px"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
    ${msg ? `<div class="aviso erro">${esc(msg)}</div>` : ''}
    <button class="btn pri big">Entrar</button></form></main>`;
  let u = usr || ''; if (!u) try { u = localStorage.getItem('rh_login') || ''; } catch (e) {}
  $('#usuario').value = u; (u ? $('#senha') : $('#usuario')).focus();
}
const limparSessao = () => { R.senha = ''; R.user = null; R.cfg = null; try { sessionStorage.removeItem('rh_s'); sessionStorage.removeItem('rh_u'); } catch (x) {} };
async function entrarRH(e) {
  e.preventDefault();
  const usuario = $('#usuario').value.trim().toLowerCase(), b = e.target.querySelector('button');
  b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r = await api('entrar', { usuario, senha: $('#senha').value });
    R.senha = r.token; R.user = r.usuario;
    try { sessionStorage.setItem('rh_u', JSON.stringify(r.usuario)); localStorage.setItem('rh_login', usuario); } catch (x) {}
    carregarLista(true);
  } catch (x) { telaLogin(x.message, usuario); }
}
const ehAdmin = () => R.user && R.user.perfil === 'admin';
function erroRH(e) {
  if (/sessão expirada|senha incorreta|tentativas/i.test(e.message)) { limparSessao(); telaLogin(e.message); }
  else toast(e.message, 'erro');
}
async function carregarLista(mostrar) {
  if (mostrar) carregandoRH('Carregando…');
  try {
    const r = await api('listar', { senha: R.senha });
    R.itens = r.itens || []; R.eventos = r.eventos || []; R.al = alertas(); R.candNovos = +r.candNovos || 0;
    try { sessionStorage.setItem('rh_s', R.senha); } catch (e) {}
    R.det = null; R.form = null; rLista();
  } catch (e) { erroRH(e); }
}

const CORES_AV = ['#1E7A3D', '#2a6fdb', '#C2412D', '#B7791F', '#6B4FBB', '#0F766E', '#BE185D', '#475569'];
function avatar(nome, t = 40) {
  const p = String(nome || '?').trim().split(/\s+/);
  const ini = ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  let h = 0; for (const ch of String(nome || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="av" style="width:${t}px;height:${t}px;font-size:${Math.round(t * .38)}px;background:${CORES_AV[h % CORES_AV.length]}">${esc(ini)}</span>`;
}

function itensHTML() {

    const txt = R.aba === 'func'
      ? (R.itens.some(a => ['aprovado', 'desligado'].includes(a.status)) ? 'Nenhum funcionário neste filtro.' : 'Cadastre quem já trabalha no posto em <b>Cadastrar funcionário</b>. Quem entrar pelo portal de admissão aparece aqui depois de aprovado.')

    return `<div class="vazio card"><h2>Nada por aqui</h2><p>${txt}</p></div>`;

const MES_AB = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const anoDe = v => { const d = data(v); return d ? d.getFullYear() : null; };
function mesesTxt(m) {
  m = Math.round(m); const a = Math.floor(m / 12), r = m % 12;
  return a ? `${a} ano${a > 1 ? 's' : ''}${r ? ` e ${r} ${r > 1 ? 'meses' : 'mês'}` : ''}` : `${m} ${m === 1 ? 'mês' : 'meses'}`;
}
function barrasH(pares) {
  const max = Math.max(1, ...pares.map(p => p[1]));
  return `<div class="hbar">${pares.map(([l, v]) => `<span class="hl">${esc(l)}</span><span class="tr"><i style="width:${v ? Math.max(3, Math.round(v / max * 100)) : 0}%"></i></span><b>${v}</b>`).join('')}</div>`;
}
function rInicio() {
  const it = R.itens, at = it.filter(a => a.status === 'aprovado'), h = hoje0(), ano = h.getFullYear();
  const efet = it.filter(a => ['aprovado', 'desligado'].includes(a.status));

  const desAno = it.filter(a => a.status === 'desligado' && anoDe(a.deslig_data) === ano).length;
  const mesesCasa = at.map(a => { const d = data(a.data_admissao); return d ? (h - d) / (86400000 * 30.44) : null; }).filter(v => v !== null && v >= 0);
  const media = mesesCasa.length ? mesesCasa.reduce((t, v) => t + v, 0) / mesesCasa.length : null;
  const avisos = R.al.filter(x => x.nivel > 0), urg = avisos.filter(x => x.nivel === 2).length;
  const conferir = it.filter(a => a.status === 'enviado').length, preench = it.filter(a => ['novo', 'preenchendo', 'correcao'].includes(a.status)).length;
  const meses = Array.from({ length: 12 }, (_, i) => { const d = new Date(ano, h.getMonth() - 11 + i, 1); return { y: d.getFullYear(), m: d.getMonth(), l: MES_AB[d.getMonth()], a: 0, d: 0 }; });
  const noMes = (v, k) => { const d = data(v); if (!d) return; const x = meses.find(m => m.y === d.getFullYear() && m.m === d.getMonth()); if (x) x[k]++; };
  efet.forEach(a => noMes(a.data_admissao, 'a'));

      <div class="det-acoes" style="margin:0"><button class="btn sec" data-act="nova">${ic('send')}Nova admissão</button><button class="btn ouro" data-act="cadastrar">${ic('userplus')}Cadastrar funcionário</button></div></div>
    ${!efet.length ? `<section class="card"><h2>Comece por aqui</h2><p class="muted">Cadastre quem já trabalha no posto em <b>Cadastrar funcionário</b> ou mande o link de <b>Nova admissão</b> para quem está entrando. Os gráficos aparecem assim que houver funcionários.</p></section>` : ''}
    <div class="kpis">
      <div class="kpi" data-act="nav" data-n="func"><span>Funcionários ativos</span><b>${at.length}</b><small>${admAno} admitido(s) em ${ano}</small></div>
      <div class="kpi claro"><span>Desligamentos</span><b>${desAno}</b><small>em ${ano}</small></div>
      <div class="kpi claro"><span>Tempo médio de casa</span><b class="menor">${media === null ? '—' : mesesTxt(media)}</b><small>dos ativos</small></div>

    </div>
    ${(() => { const ab = at.filter(a => a.atualizacao === 'aberta').length, en = at.filter(a => a.atualizacao === 'enviada').length;

    <div class="dash">

const normH = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve();

function dataPlanilha(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number' && v > 1000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{2,4})$/);
  if (!m) { const g = dig(t); if (g.length === 8) m = [0, g.slice(0, 2), g.slice(2, 4), g.slice(4)]; }
  if (!m) return '';
  let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000;
  const r = `${y}-${String(+m[2]).padStart(2, '0')}-${String(+m[1]).padStart(2, '0')}`;
  return data(r) ? r : '';
}
const CIVIL = { c: 'Casado(a)', s: 'Solteiro(a)', d: 'Divorciado(a)', v: 'Viúvo(a)', u: 'União estável' };
const CARGO_FIX = { auxgeral: 'Auxiliar geral' };
const tituloCargo = v => { const n = normH(v).replace(/\s+/g, ''); if (CARGO_FIX[n]) return CARGO_FIX[n];
  return String(v || '').trim().toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase()); };
function lerLinhas(rows) {
  const hi = rows.findIndex(r => r.some(c => normH(c) === 'nome' || normH(c).startsWith('nome')) && r.some(c => normH(c).includes('cpf')));
  if (hi < 0) throw new Error('Não achei as colunas "Nome" e "CPF" na planilha.');
  const h = rows[hi].map(normH), col = t => h.findIndex(t);
  const ix = { nome: col(x => x.startsWith('nome')), cpf: col(x => x.includes('cpf')), nasc: col(x => x.includes('nasc')),
    adm: col(x => x.includes('admiss')), sexo: col(x => x.includes('sexo')), civil: col(x => x.includes('civil')),
    cargo: col(x => x.includes('cargo') || x.includes('funcao')), cel: col(x => x.includes('celular') || x.includes('telefone') || x.includes('fone')) };
  const v = (r, k) => ix[k] >= 0 ? r[ix[k]] : '';
  return rows.slice(hi + 1).filter(r => String(v(r, 'nome')).trim()).map(r => {
    const cpf = dig(v(r, 'cpf')), cel = dig(v(r, 'cel')), sx = normH(v(r, 'sexo'))[0], ec = normH(v(r, 'civil'))[0];
    const o = { nome: String(v(r, 'nome')).trim().replace(/\s+/g, ' ').toUpperCase(), cpf: cpf.length === 11 ? mascara('000.000.000-00', cpf) : String(v(r, 'cpf')).trim(),
      nascimento: dataPlanilha(v(r, 'nasc')), data_admissao: dataPlanilha(v(r, 'adm')),
      sexo: sx === 'm' ? 'Masculino' : sx === 'f' ? 'Feminino' : '', estado_civil: CIVIL[ec] || '',
      cargo: tituloCargo(v(r, 'cargo')), celular: [10, 11].includes(cel.length) ? mascara('tel', cel) : '' };
    o.alertas = [!cpfOk(o.cpf) && 'CPF inválido', !o.nascimento && 'sem data de nascimento', !o.data_admissao && 'sem data de admissão'].filter(Boolean);

const holVisiveis = () => { const hs = holeritesDe(R.det.docs), n = R.holN || 3; return n === 'todos' ? hs : hs.slice(0, n); };
async function juntarHolerites(b) {
  const vis = holVisiveis(); if (!vis.length) return;
  const txt = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="spin"></span> Juntando…';
  try {
    const { PDFLib } = await libsPdf();
    const r = await api('baixarArquivos', { senha: R.senha, codigo: R.det.adm.codigo, file_ids: vis.map(h => h.f.file_id) });
    const porId = Object.fromEntries(r.arquivos.map(a => [a.file_id, a]));
    const out = await PDFLib.PDFDocument.create();
    for (const h of [...vis].reverse()) { // do mais antigo para o mais recente
      const a = porId[h.f.file_id]; if (!a) continue;
      const bytes = Uint8Array.from(atob(a.base64), c => c.charCodeAt(0));
      if (/pdf/.test(a.mime)) { const src = await PDFLib.PDFDocument.load(bytes); (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg)); }
      else if (/jpe?g|png/.test(a.mime)) {
        const img = /png/.test(a.mime) ? await out.embedPng(bytes) : await out.embedJpg(bytes);
        const pg = out.addPage([595, 842]), k = Math.min(555 / img.width, 802 / img.height);
        pg.drawImage(img, { x: (595 - img.width * k) / 2, y: (842 - img.height * k) / 2, width: img.width * k, height: img.height * k });
      }
    }
    const nome = `Holerites ${primeiro(R.det.adm.nome)} - ${vis.length > 1 ? `${compTxt(vis[vis.length - 1].comp)} a ${compTxt(vis[0].comp)}` : compTxt(vis[0].comp)}.pdf`.replace(/\//g, '-');
    const url = URL.createObjectURL(new Blob([await out.save()], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('PDF baixado: ' + nome);
  } catch (e) { erroRH(e); }
  b.disabled = false; b.innerHTML = txt;
}

function exportarVcf() {
  const l = (R.com && R.com.dados ? R.com.dados : R.itens).filter(a => a.status === 'aprovado' && [10, 11].includes(dig(a.celular).length)).sort(nomeSort);
  if (!l.length) { toast('Nenhum funcionário ativo com celular cadastrado', 'erro'); return; }
  const e = v => String(v).replace(/([\\,;])/g, '\\$1');
  const txt = l.map(a => ['BEGIN:VCARD', 'VERSION:3.0', `N:;TREVO – ${e(a.nome)};;;`, `FN:TREVO – ${e(a.nome)}`, 'ORG:Posto Trevo',
    `TEL;TYPE=CELL:+55${dig(a.celular)}`, 'END:VCARD'].join('\r\n')).join('\r\n') + '\r\n';
  const x = document.createElement('a');
  x.href = URL.createObjectURL(new Blob([txt], { type: 'text/vcard;charset=utf-8' }));
  x.download = 'Contatos Posto Trevo.vcf';
  document.body.appendChild(x); x.click(); x.remove();
  setTimeout(() => URL.revokeObjectURL(x.href), 5000);
  const sem = (R.com && R.com.dados ? R.com.dados : R.itens).filter(a => a.status === 'aprovado').length - l.length;
  toast(`${l.length} contato(s) exportado(s)${sem ? ` · ${sem} sem celular válido` : ''}`);
}

async function salvarHolerites(m, b) {
  const H = R.hol;
  if (H.res.some(holPendente)) { toast('Confira as páginas em amarelo antes de salvar', 'erro'); return; }
  const sem = H.res.filter(r => !r.a && r.como !== 'vazia').length;
  if (sem && !confirm(`${sem} página(s) ficaram sem dono e não vão para ninguém. Salvar assim mesmo?`)) return;
  b.disabled = true;
  try {
    const { PDFLib, pdfjs } = await libsPdf();
    const src = await PDFLib.PDFDocument.load(H.bytes);
    const grupos = new Map();
    H.res.forEach((r, i) => { if (r.a) { if (!grupos.has(r.a.codigo)) grupos.set(r.a.codigo, { a: r.a, pags: [] }); grupos.get(r.a.codigo).pags.push(i); } });
    const lista = [...grupos.values()];
    // 1) separa todos e confere cada arquivo ANTES de salvar qualquer um
    for (const [k, g] of lista.entries()) {
      b.innerHTML = `<span class="spin"></span> Separando e conferindo ${k + 1} de ${lista.length}…`;
      const novo = await PDFLib.PDFDocument.create();
      (await novo.copyPages(src, g.pags)).forEach(p => novo.addPage(p));
      novo.setTitle(`Holerite ${H.comp.slice(5)}/${H.comp.slice(0, 4)} – ${g.a.nome}`);
      g.bytes = await novo.save();
      const prob = await conferirArquivo(pdfjs, g, H);
      if (prob) throw new Error(`Parei sem salvar nada: ${prob} Confira o PDF ou fale com o suporte.`);
    }
    // 2) salva em lotes
    const salvos = [];
    for (let i = 0; i < lista.length; i += 5) {
      const lote = [];
      for (const g of lista.slice(i, i + 5)) lote.push({ codigo: g.a.codigo, base64: await paraB64(new Blob([g.bytes], { type: 'application/pdf' })) });
      b.innerHTML = `<span class="spin"></span> Salvando ${salvos.length + lote.length} de ${lista.length}…`;
      const r = await api('salvarHolerites', { senha: R.senha, competencia: H.comp, itens: lote });
      salvos.push(...r.salvos);
    }
    const comp = H.comp; R.hol = null;
    resultadoHolerites(m, comp, lista.map(g => g.a), salvos);
  } catch (e) { b.disabled = false; b.textContent = 'Tentar de novo'; erroRH(e); }
}
// lê de novo o arquivo separado: cada página tem que ser igual à original e não pode ser de outra pessoa
async function conferirArquivo(pdfjs, g, H) {
  const txt = await textosDoPdf(pdfjs, g.bytes);
  if (txt.length !== g.pags.length) return `o arquivo de ${g.a.nome} ficou com ${txt.length} página(s) em vez de ${g.pags.length}.`;
  const outrosCpf = new Set(H.pessoas.filter(p => p !== g.a).map(p => dig(p.cpf)).filter(c => c.length === 11));
  const nomesOutros = H.pessoas.filter(p => p !== g.a && normTxt(p.nome).split(' ').length >= 2 && !normTxt(g.a.nome).includes(normTxt(p.nome))).map(p => ' ' + normTxt(p.nome) + ' ');
  for (let j = 0; j < txt.length; j++) {
    if (normTxt(txt[j]) !== normTxt(H.textos[g.pags[j]])) return `a página ${g.pags[j] + 1} saiu diferente no arquivo de ${g.a.nome}.`;
    const N = ' ' + normTxt(txt[j]) + ' ';
    if (cpfsDoTexto(txt[j]).some(c => outrosCpf.has(c))) return `o arquivo de ${g.a.nome} tem o CPF de outro funcionário (página ${g.pags[j] + 1}).`;
    const outro = nomesOutros.find(n => N.includes(n));
    if (outro) return `o arquivo de ${g.a.nome} tem o nome de outro funcionário (${outro.trim()}, página ${g.pags[j] + 1}).`;
  }
  return '';
}

const CODIGO = new URLSearchParams(location.search).get('c');
const GRUPO = !CODIGO && new URLSearchParams(location.search).has('atualizar');
const TRABALHE = !CODIGO && !GRUPO && /^\?(trabalhe|vagas)\b/i.test(location.search);
const MEURH = !CODIGO && !GRUPO && /^\?(meurh|app|holerites?)\b/i.test(location.search);
const MODO_COLAB = !!(CODIGO || GRUPO);
const ACOES = MODO_COLAB ? ACOES_COLAB : ACOES_RH;

document.addEventListener('click', e => {

  const fn = ACOES[b.dataset.act] || (b.dataset.act === 'fechar' && fecharModal) || (b.dataset.act === 'copiar' && (() => copiar(b.dataset.v)));
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('input', e => {

  if (MODO_COLAB && el.dataset.k) aoDigitarColab(el);

  if (el.id === 'n_cel' || el.id === 't_cel') el.value = mascara('tel', el.value);
  if (el.id === 'm_cpf' || el.id === 'a_cpf') el.value = mascara('000.000.000-00', el.value);
  if (el.id === 'a_cod') el.value = dig(el.value).slice(0, 6);
  if (!MODO_COLAB && R.form && el.dataset.k) { aoDigitar(el, R.form.d, R.form.mapa); R.form.aoMudar && R.form.aoMudar(el.dataset.k, R.form.d); }
  if (el.id === 'busca') { R.busca = el.value; $('#itens').innerHTML = itensHTML(); }
  if (el.id === 'cbusca') { R.cbusca = el.value; $('#citens').innerHTML = candItens(); }

  if (el.id === 'com_busca_p') { R.com.form.buscaP = el.value; $('#com_pes').innerHTML = listaPessoasCom(); }
  if (el.id === 'com_msg') { R.com.form.m = el.value; atualizarPrevia(); }
  if (el.id === 'rel_busca') { R.rel.busca = el.value; const l = relLinhas(); $('#rel_tab').innerHTML = tabelaHTML(REL[R.rel.tipo], l); $('#rel_n').textContent = l.length + ' pessoa(s)'; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.up) { const fs = [...el.files]; el.value = ''; if (fs.length) subir(el.dataset.up, fs); }
  if (el.id === 'com_email') R.com.form.email = el.checked;
  if (el.dataset.pessoa !== undefined) {
    const f = R.com.form, c = el.dataset.pessoa; f.pessoas = f.pessoas || [];
    f.pessoas = el.checked ? [...new Set([...f.pessoas, c])] : f.pessoas.filter(x => x !== c);
    el.closest('.pes').classList.toggle('on', el.checked); atualizarPrevia();
  }
  if (el.dataset.cargo !== undefined) {
    const f = R.com.form, c = el.dataset.cargo;
    if (!c) f.cargos = []; else f.cargos = el.checked ? [...f.cargos, c] : f.cargos.filter(x => x !== c);
    document.querySelectorAll('[data-cargo]').forEach(i => { i.checked = i.dataset.cargo ? f.cargos.includes(i.dataset.cargo) : !f.cargos.length; });
    atualizarPrevia();
  }
  if (el.id === 'rel_tipo') { R.rel.tipo = el.value; if (REL[el.value].st) R.rel.st = REL[el.value].st; else if (R.rel.st === 'desligados') R.rel.st = 'ativos'; rRel(); }
  if (el.id === 'rel_st') { R.rel.st = el.value; rRel(); }
  if (el.id === 'rel_mes') { R.rel.mes = +el.value; rRel(); }
  if (el.id === 'aceite') { C.aceite = el.checked; const b = $('#btnEnviar'); if (b) b.disabled = !C.aceite || pendencias().length > 0; }
  if (MODO_COLAB && el.dataset.k && el.tagName === 'SELECT') aoDigitarColab(el);
  if (!MODO_COLAB && R.form && el.dataset.k && el.tagName === 'SELECT') { aoDigitar(el, R.form.d, R.form.mapa); R.form.aoMudar && R.form.aoMudar(el.dataset.k, R.form.d); }
});

  if (e.target.id === 'ftrab') return enviarTrabalhe(e);
  if (e.target.id === 'fmeu') return meuEntrar(e);
  if (e.target.id === 'fmeuat') return meuAtivar(e);
  if (e.target.id !== 'flogin') return;
  entrarRH(e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

if (CODIGO) { document.title = 'Ficha de admissão · Posto Trevo'; iniciarColab(CODIGO); }
else if (GRUPO) {
  document.title = 'Atualização cadastral · Posto Trevo';
  let c = ''; try { c = sessionStorage.getItem('grp_c') || ''; } catch (e) {}
  if (c) iniciarColab(c); else telaGrupo();
}
else if (TRABALHE) { document.title = 'Trabalhe Conosco · Posto Trevo'; telaTrabalhe(); }
else if (MEURH) { document.title = 'Meu RH · Posto Trevo'; meuToken() ? carregarMeu() : telaMeuLogin(); }
else iniciarRH();
</script>
</body>
</html>
